version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@vercel/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss"]
      markdown:
        patterns: ["next-mdx-remote", "remark-*", "unified", "unist-*", "@types/mdast", "@types/hast"]
      dev-tooling:
        patterns: ["eslint", "typescript", "@types/node"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
